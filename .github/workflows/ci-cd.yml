# ============================================================
# MyCargoLens — CI/CD Pipeline
# ============================================================
# Triggers: Push to main, Pull Requests
# Jobs: Lint → Test (frontend + server) → Docker Push → Deploy
# ============================================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, staging]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch/PR when a new commit lands — keeps
# us from piling up hung jobs and ensures "latest push" is always what deploys.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Lint & Type Check ────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # ── Supply-chain guard ──────────────────────────────
      # A malware loader hid in postcss.config.js for four months
      # (docs/security/incident-2026-08-18-postcss-malware.md): ~7 KB of
      # obfuscated code appended after the config object behind a long
      # whitespace run, so it diffed as "4 +-" and sat off-screen in an
      # editor. Config files are tiny and hand-written — anything long or
      # obfuscated in one is an intrusion, so fail the build on sight.
      # Runs BEFORE `npm ci` so a compromised repo can't install first.
      - name: Scan config files for injected code
        run: |
          set -euo pipefail
          fail=0

          # 1. Known obfuscator signatures, anywhere in tracked source.
          if git grep -nIE 'var _\$_[0-9a-f]+ *= *\(function|eth_getTransactionByHash|api\.trongrid\.io|fullnode\.mainnet\.aptoslabs\.com|bsc-dataseed' \
               -- '*.js' '*.cjs' '*.mjs' '*.ts' '*.tsx' '*.json' ; then
            echo "::error::Obfuscator / blockchain-C2 signature found in tracked source."
            fail=1
          fi

          # 2. Config files must stay small and un-minified. Real configs are
          #    a few hundred bytes; 2000+ chars on one line means packed code.
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            if awk 'length($0) > 2000 { exit 0 } END { exit 1 }' "$f"; then
              echo "::error file=$f::Config file contains a >2000-char line — suspected packed/obfuscated code."
              fail=1
            fi
          done < <(git ls-files -- '*.config.js' '*.config.mjs' '*.config.cjs' '*.config.ts' 'postcss.config.*' 'vite.config.*' 'tailwind.config.*')

          if [ "$fail" -ne 0 ]; then
            echo "See docs/security/incident-2026-08-18-postcss-malware.md"
            exit 1
          fi
          echo "Config scan clean."

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install frontend deps
        run: npm ci

      - name: Lint frontend
        run: npm run lint

      - name: Type check frontend
        run: npx tsc --noEmit --project tsconfig.app.json

      - name: Install server deps
        working-directory: server
        run: npm ci

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit --project tsconfig.build.json

  # ── Frontend Tests ───────────────────────────────────────
  # Runs `vitest --passWithNoTests` against src/. Currently a placeholder
  # job — no FE tests live in the repo today. Kept as a slot so we can
  # land FE tests without re-touching this workflow.
  test-frontend:
    name: Tests (frontend)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Run tests
        run: npm test

  # ── Server Tests ─────────────────────────────────────────
  # Pre-Phase-10 the only test job ran `npm test` at repo root, which only
  # matched src/test/example.test.ts (the tautology test, deleted in
  # Phase 1) — the two real server tests (validation.test.ts +
  # ccErrorMapping.test.ts) never ran on merges to main. Splitting into a
  # dedicated server job gives the high-quality tests an actual CI gate.
  test-server:
    name: Tests (server)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

  # ── Build & Push Docker Image ────────────────────────────
  # (The standalone "Build" job was removed — its artifact was never consumed,
  #  and the Docker job builds the frontend inside the container via Dockerfile
  #  stage `frontend-builder`. Keeping only this single build source of truth.)
  docker:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test-frontend, test-server]
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag with full commit SHA (for rollback) + latest (for convenience)
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build & Push Landing Docker Image ─────────────────────
  docker-landing:
    name: Docker Build & Push (Landing)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-server]
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-landing
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push landing
        uses: docker/build-push-action@v6
        with:
          context: ./landing
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  # ── Build & Push MQ Bridge Docker Image ───────────────────
  # CBP MQIPT sidecar (server/mq-bridge). Debian-based because IBM's MQ
  # client is glibc-only. Deployed only where COMPOSE_PROFILES=mqipt.
  docker-mq-bridge:
    name: Docker Build & Push (MQ Bridge)
    runs-on: ubuntu-latest
    needs: [test-frontend, test-server]
    timeout-minutes: 20
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      # The CBP environment check (CERT↔QGC1, PROD↔QGP2) is pure JS with no
      # MQ dependency, so it is tested before any image is built.
      - name: Test mq-bridge environment check
        working-directory: server/mq-bridge
        run: node --test

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mq-bridge
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push mq-bridge
        uses: docker/build-push-action@v6
        with:
          context: ./server/mq-bridge
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mq-bridge
          cache-to: type=gha,mode=max,scope=mq-bridge

  # ── Deploy (customize per hosting provider) ──────────────
  # ── Deploy APP (server) — branch-aware ───────────────────
  # main   → production environment → new VPS (prod app, app.mycargolens.com)
  # staging→ staging environment    → current VPS (staging app, staging.mycargolens.com)
  # Server ONLY. The prod marketing landing lives on the current VPS and is
  # shipped by the separate deploy-landing job (main only) so a staging-app
  # deploy never restarts prod marketing.
  deploy-app:
    name: Deploy app (main=prod / staging=staging)
    runs-on: ubuntu-latest
    needs: [docker, docker-mq-bridge]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    environment: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # Copy the committed prod compose to the VPS BEFORE the ssh-action runs.
      # Replaces the old in-place sed-patching that lived inside the ssh
      # script — every env-var addition used to require editing both this
      # workflow AND the patching code on prod, which was the mechanism
      # that contributed to the 2026-06-01 outage (the empty-shell-env
      # override hazard lived in that same path).
      - name: Sync deploy/docker-compose.prod.yml to VPS
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/mycargolens/
          strip_components: 1
          overwrite: true

      - name: Deploy via SSH (SHA-tagged, health-gated, auto-rollback)
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        uses: appleboy/ssh-action@v1
        env:
          NEW_TAG: ${{ github.sha }}
          # The CBP environment this deploy target must declare, from the
          # branch, not from the VM: staging -> CBP CERT, main -> CBP PROD.
          EXPECTED_CBP_ENV: ${{ github.ref_name == 'main' && 'PROD' || 'CERT' }}
          # AI provider env vars — sourced from GitHub repo secrets, written
          # into /opt/mycargolens/.env at the start of the deploy script so the
          # server container picks them up on the upcoming `docker compose up`.
          # Provider-agnostic naming: AI_PROVIDER chooses the backend (openai,
          # anthropic, etc.) and AI_API_KEY is the matching credential.
          AI_ASSESSMENT_ENABLED:    ${{ secrets.AI_ASSESSMENT_ENABLED }}
          AI_PROVIDER:              ${{ secrets.AI_PROVIDER }}
          AI_MODEL:                 ${{ secrets.AI_MODEL }}
          AI_API_KEY:               ${{ secrets.AI_API_KEY }}
          AI_MAX_TOKENS:            ${{ secrets.AI_MAX_TOKENS }}
          AI_TEMPERATURE:           ${{ secrets.AI_TEMPERATURE }}
          AI_RATE_LIMIT_PER_USER:   ${{ secrets.AI_RATE_LIMIT_PER_USER }}
          AI_DISABLE_TRAINING_DATA: ${{ secrets.AI_DISABLE_TRAINING_DATA }}
          # Terminal 49 (Container Tracking). Optional — the server self-disables
          # the feature when the key is blank.
          TERMINAL49_API_BASE_URL:  ${{ secrets.TERMINAL49_API_BASE_URL }}
          TERMINAL49_API_KEY:       ${{ secrets.TERMINAL49_API_KEY }}
          # Rotatable secrets. Each maps to a GitHub Secret of the same name.
          # `upsert_env` below skips empty values so a missing secret here does
          # NOT wipe a working VPS .env line — the founder can roll these in
          # one at a time as they rotate at the provider end.
          # (The sed-based wiring on these is interim. Phase 5 of the audit
          # plan replaces the whole mechanism with a committed compose.prod.yml
          # that pulls every env var from a single canonical source.)
          CC_API_TOKEN:             ${{ secrets.CC_API_TOKEN }}
          CC_ENVIRONMENT:           ${{ secrets.CC_ENVIRONMENT }}
          STRIPE_SECRET_KEY:        ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET:    ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PUBLISHABLE_KEY:   ${{ secrets.STRIPE_PUBLISHABLE_KEY }}
          JWT_ACCESS_SECRET:        ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET:       ${{ secrets.JWT_REFRESH_SECRET }}
          EMAIL_USER:               ${{ secrets.EMAIL_USER }}
          EMAIL_PASS:               ${{ secrets.EMAIL_PASS }}
          # Sentry (audit Phase 10). Server runtime DSN only — SPA / landing
          # client DSNs are baked into their bundles at build time, see
          # NEXT_PUBLIC_SENTRY_DSN / VITE_SENTRY_DSN docker build args
          # (those build paths are added in Phase 10b).
          SENTRY_DSN:               ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT:       ${{ secrets.SENTRY_ENVIRONMENT }}
          # AI chat assistant — HMAC secret for anonymous visitor tokens.
          # Required in production (server env.ts rejects the dev default when
          # CHAT_ENABLED). Set as an Environment secret per env (staging/production).
          CHAT_SESSION_SECRET:      ${{ secrets.CHAT_SESSION_SECRET }}
          # MFA — AES-256-GCM key (64 hex chars) encrypting TOTP secrets at
          # rest. Required in production (server env.ts rejects a missing key).
          # Set as an Environment secret per env (staging/production).
          MFA_ENC_KEY:              ${{ secrets.MFA_ENC_KEY }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: NEW_TAG,EXPECTED_CBP_ENV,AI_ASSESSMENT_ENABLED,AI_PROVIDER,AI_MODEL,AI_API_KEY,AI_MAX_TOKENS,AI_TEMPERATURE,AI_RATE_LIMIT_PER_USER,AI_DISABLE_TRAINING_DATA,TERMINAL49_API_BASE_URL,TERMINAL49_API_KEY,CC_API_TOKEN,CC_ENVIRONMENT,STRIPE_SECRET_KEY,STRIPE_WEBHOOK_SECRET,STRIPE_PUBLISHABLE_KEY,JWT_ACCESS_SECRET,JWT_REFRESH_SECRET,EMAIL_USER,EMAIL_PASS,SENTRY_DSN,SENTRY_ENVIRONMENT,CHAT_SESSION_SECRET,MFA_ENC_KEY
          script: |
            set -euo pipefail
            cd /opt/mycargolens

            # ── CBP environment must match the deploy target ──────────────
            # The VM .env is hand-maintained; one wrong CBP_ENVIRONMENT would
            # point server and bridge at the other CBP system together, which
            # their own cross-checks cannot see. Refuse before touching anything.
            env_value() { (grep "^$1=" .env || true) | tail -1 | cut -d= -f2- | tr -d '"\r '; }
            DECLARED_CBP_ENV=$(env_value CBP_ENVIRONMENT | tr '[:lower:]' '[:upper:]')
            DECLARED_TRANSPORT=$(env_value ABI_TRANSPORT | tr '[:upper:]' '[:lower:]')
            if [ -n "$DECLARED_CBP_ENV" ] && [ "$DECLARED_CBP_ENV" != "NONE" ] && [ "$DECLARED_CBP_ENV" != "$EXPECTED_CBP_ENV" ]; then
              echo "❌ .env declares CBP_ENVIRONMENT=${DECLARED_CBP_ENV}, but this deploy target is CBP ${EXPECTED_CBP_ENV}. Refusing to deploy."
              exit 1
            fi
            if [ "$DECLARED_TRANSPORT" = "mqipt" ] && [ "$DECLARED_CBP_ENV" != "$EXPECTED_CBP_ENV" ]; then
              echo "❌ ABI_TRANSPORT=mqipt requires CBP_ENVIRONMENT=${EXPECTED_CBP_ENV} in .env. Refusing to deploy."
              exit 1
            fi

            # ── Activate the just-scp'd compose file ─────────────────────
            # The scp-action step above dropped deploy/docker-compose.prod.yml
            # at /opt/mycargolens/docker-compose.prod.yml. Rename it into
            # place so `docker compose` picks it up. Atomic mv so a partial
            # transfer never leaves the running compose file in a half state.
            if [ -f docker-compose.prod.yml ]; then
              mv -f docker-compose.prod.yml docker-compose.yml
              echo "▶ Activated freshly-synced docker-compose.yml"
            else
              echo "⚠ No docker-compose.prod.yml found from scp step; keeping current docker-compose.yml"
            fi

            # ── Drop empty shell env vars so they don't override .env ──
            # `envs:` above forwards every listed GitHub Secret into this SSH
            # session's shell. A secret that isn't set in the repo evaluates
            # to "" — but it's STILL exported as an empty shell var. docker
            # compose's interpolation order is shell-env → .env, so the empty
            # shell var wins and overrides a perfectly valid .env value at
            # container-create time.
            #
            # This is what took prod down on 2026-06-01 (Phase 2 of the audit
            # added JWT_ACCESS_SECRET / JWT_REFRESH_SECRET to envs: before
            # the GitHub Secrets were populated → empty shell var → container
            # got empty JWT secrets → Zod rejected → crash-loop → rollback
            # ran into the same empty env → also crashed).
            #
            # Unsetting empties up-front means: if a secret is not in GitHub
            # Secrets, docker compose falls through to .env. The upsert_env
            # function below also short-circuits on empty so the .env file is
            # left untouched — the existing value continues to be used.
            for var in JWT_ACCESS_SECRET JWT_REFRESH_SECRET \
                       CC_API_TOKEN CC_ENVIRONMENT \
                       STRIPE_SECRET_KEY STRIPE_WEBHOOK_SECRET STRIPE_PUBLISHABLE_KEY \
                       EMAIL_USER EMAIL_PASS \
                       AI_API_KEY AI_ASSESSMENT_ENABLED AI_PROVIDER AI_MODEL \
                       AI_MAX_TOKENS AI_TEMPERATURE AI_RATE_LIMIT_PER_USER \
                       AI_DISABLE_TRAINING_DATA \
                       TERMINAL49_API_BASE_URL TERMINAL49_API_KEY \
                       CHAT_SESSION_SECRET MFA_ENC_KEY; do
              # The :- handles the case where the var is unset entirely (set -u
              # would otherwise blow up here). If empty, unset it; printf the
              # outcome so deploy logs make the decision auditable.
              eval "current=\${$var:-}"
              if [ -z "$current" ]; then
                unset "$var" 2>/dev/null || true
                printf '%s\n' "▶ (unset) $var — falling through to .env"
              fi
            done

            # ── Sync AI_* env vars from GitHub Secrets into the VPS .env ──
            # Idempotent upsert: replace the line if it already exists, append
            # if it doesn't. Only touches lines prefixed with AI_ so other
            # secrets (CC_*, STRIPE_*, etc.) are never modified. Empty values
            # from secrets are skipped so a misconfigured secret can't wipe a
            # working line.
            upsert_env() {
              local key="$1" val="$2"
              [ -z "$val" ] && return 0
              if grep -q "^${key}=" .env; then
                # Use a delimiter unlikely in API keys; escape only the
                # replacement-side backslashes & ampersands.
                local escaped
                escaped=$(printf '%s' "$val" | sed -e 's/[\\&|]/\\&/g')
                sed -i "s|^${key}=.*|${key}=${escaped}|" .env
              else
                printf '%s=%s\n' "$key" "$val" >> .env
              fi
            }
            upsert_env AI_ASSESSMENT_ENABLED "${AI_ASSESSMENT_ENABLED:-}"
            upsert_env AI_PROVIDER "${AI_PROVIDER:-}"
            upsert_env AI_MODEL "${AI_MODEL:-}"
            upsert_env AI_API_KEY "${AI_API_KEY:-}"
            upsert_env AI_MAX_TOKENS "${AI_MAX_TOKENS:-}"
            upsert_env AI_TEMPERATURE "${AI_TEMPERATURE:-}"
            upsert_env AI_RATE_LIMIT_PER_USER "${AI_RATE_LIMIT_PER_USER:-}"
            upsert_env AI_DISABLE_TRAINING_DATA "${AI_DISABLE_TRAINING_DATA:-}"
            upsert_env TERMINAL49_API_BASE_URL "${TERMINAL49_API_BASE_URL:-}"
            upsert_env TERMINAL49_API_KEY "${TERMINAL49_API_KEY:-}"
            # Rotatable secrets — each upsert is a no-op when the matching
            # GitHub Secret is unset, so this is safe to merge before all of
            # them are populated.
            upsert_env CC_API_TOKEN "${CC_API_TOKEN:-}"
            upsert_env CC_ENVIRONMENT "${CC_ENVIRONMENT:-}"
            upsert_env STRIPE_SECRET_KEY "${STRIPE_SECRET_KEY:-}"
            upsert_env STRIPE_WEBHOOK_SECRET "${STRIPE_WEBHOOK_SECRET:-}"
            upsert_env STRIPE_PUBLISHABLE_KEY "${STRIPE_PUBLISHABLE_KEY:-}"
            upsert_env JWT_ACCESS_SECRET "${JWT_ACCESS_SECRET:-}"
            upsert_env JWT_REFRESH_SECRET "${JWT_REFRESH_SECRET:-}"
            upsert_env EMAIL_USER "${EMAIL_USER:-}"
            upsert_env EMAIL_PASS "${EMAIL_PASS:-}"
            upsert_env SENTRY_DSN "${SENTRY_DSN:-}"
            upsert_env SENTRY_ENVIRONMENT "${SENTRY_ENVIRONMENT:-}"
            upsert_env CHAT_SESSION_SECRET "${CHAT_SESSION_SECRET:-}"
            upsert_env MFA_ENC_KEY "${MFA_ENC_KEY:-}"
            echo "▶ AI_* + TERMINAL49_* + rotatable secrets synced from GitHub Secrets"

            # The compose file is now sourced verbatim from
            # deploy/docker-compose.prod.yml (scp'd in the previous step
            # of this job). The old "patch docker-compose.yml in place"
            # block — which inserted AI_* / TERMINAL49_* env var lines
            # after EMAIL_FROM_NAME — is no longer needed: every env var
            # the server reads is enumerated in the committed file.
            # See Phase 5 of the audit hardening plan.

            # ── Capture currently-deployed server tag (rollback target) ────
            OLD_TAG=$(grep '^IMAGE_TAG=' .env | cut -d= -f2)
            echo "▶ Deploying server ${NEW_TAG:0:12} (previous: ${OLD_TAG:0:12})"

            # ── Point compose at the new server image (server only — the
            #    landing tag is owned by the deploy-landing job) ────────────
            sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${NEW_TAG}|" .env

            # ── Pull the server image ─────────────────────────────────────
            if ! docker compose pull server; then
              echo "❌ Pull failed — reverting .env"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${OLD_TAG}|" .env
              exit 1
            fi

            # ── Restart the server only ───────────────────────────────────
            docker compose up -d server

            # ── Wait for server /api/health (60s max) ─────────────────────
            HEALTHY=false
            for i in $(seq 1 30); do
              if curl -fsS http://localhost:3001/api/health > /dev/null 2>&1; then
                HEALTHY=true
                break
              fi
              sleep 2
            done

            if [ "$HEALTHY" != "true" ]; then
              echo "❌ Server health check failed — rolling back"
              sed -i "s|^IMAGE_TAG=.*|IMAGE_TAG=${OLD_TAG}|" .env
              docker compose up -d server
              docker compose logs --tail=40 server || true
              exit 1
            fi

            echo "✅ Deploy complete — server live (${NEW_TAG:0:12})"

            # ── MQ bridge (CBP MQIPT sidecar) — profile-gated ─────────────
            # Runs only where .env opts in with COMPOSE_PROFILES=mqipt.
            # Pinned to this commit's bridge image (never the shared :latest,
            # which a push to the other branch would overwrite), then gated:
            # the bridge must come up serving this VM's CBP_ENVIRONMENT, or
            # it is rolled back to the image that was running before.
            if grep -q '^COMPOSE_PROFILES=.*mqipt' .env; then
              BRIDGE_IMAGE=ghcr.io/ibrahimbenrayana/cargo-compliance-hub-mq-bridge
              CBP_ENV="$DECLARED_CBP_ENV"
              OLD_BRIDGE_TAG=$(env_value MQ_BRIDGE_IMAGE_TAG)
              echo "▶ mqipt profile active — mq-bridge ${NEW_TAG:0:12} for CBP ${CBP_ENV:-<unset>} (previous: ${OLD_BRIDGE_TAG:-latest})"
              # Keep the running image addressable for rollback.
              RUNNING_BRIDGE=$(docker inspect --format '{{.Image}}' mycargolens-mq-bridge 2>/dev/null || true)
              if [ -n "$RUNNING_BRIDGE" ]; then docker tag "$RUNNING_BRIDGE" "${BRIDGE_IMAGE}:rollback"; fi
              set_bridge_tag() {
                if grep -q '^MQ_BRIDGE_IMAGE_TAG=' .env; then
                  sed -i "s|^MQ_BRIDGE_IMAGE_TAG=.*|MQ_BRIDGE_IMAGE_TAG=$1|" .env
                else
                  echo "MQ_BRIDGE_IMAGE_TAG=$1" >> .env
                fi
              }
              rollback_bridge() {
                docker compose logs --tail=40 mq-bridge || true
                if [ -n "$RUNNING_BRIDGE" ]; then
                  set_bridge_tag rollback
                  docker compose up -d mq-bridge
                else
                  # Nothing ran before: stop rather than fall back to :latest,
                  # which the other branch also publishes.
                  sed -i '/^MQ_BRIDGE_IMAGE_TAG=/d' .env
                  docker compose rm -sf mq-bridge || true
                fi
              }
              set_bridge_tag "${NEW_TAG}"
              if ! docker compose pull mq-bridge; then
                echo "❌ mq-bridge pull failed — rolling back"
                rollback_bridge
                exit 1
              fi
              docker compose up -d mq-bridge
              BRIDGE_UP=false
              for i in $(seq 1 20); do
                # The token is expanded inside the container, never on the host command line.
                BRIDGE_HEALTH=$(docker compose exec -T server sh -c 'wget -q -T 10 -O- --header "x-bridge-token: $MQIPT_BRIDGE_TOKEN" http://mq-bridge:8080/health' 2>/dev/null || true)
                if echo "$BRIDGE_HEALTH" | grep -q "\"environment\":\"${CBP_ENV}\""; then
                  BRIDGE_UP=true
                  break
                fi
                sleep 3
              done
              if [ "$BRIDGE_UP" != "true" ]; then
                echo "❌ mq-bridge did not come up serving CBP ${CBP_ENV:-<unset>} — rolling back"
                rollback_bridge
                exit 1
              fi
              if echo "$BRIDGE_HEALTH" | grep -q '"ok":true'; then
                echo "✅ mq-bridge live (${NEW_TAG:0:12}) and connected to CBP ${CBP_ENV}"
              else
                echo "⚠ mq-bridge up for CBP ${CBP_ENV}, but the MQ connection is not healthy (check the cert console Transport card)"
              fi
              docker compose ps mq-bridge
            fi

            docker image prune -f
            docker compose ps server

      - name: Deployment info (fallback when DEPLOY_METHOD unset)
        if: ${{ vars.DEPLOY_METHOD != 'ssh' }}
        run: |
          echo "🚀 Docker image pushed: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          echo ""
          echo "Auto-deploy is disabled. To enable:"
          echo "  gh variable set DEPLOY_METHOD --body ssh"
          echo "  gh secret set DEPLOY_HOST    # VPS IP"
          echo "  gh secret set DEPLOY_USER    # e.g. deploy"
          echo "  gh secret set DEPLOY_SSH_KEY # private key contents"

  # ── Deploy LANDING (marketing site) — main only, current VPS ─────────
  # The prod marketing site (mycargolens.com / www) stays on the current VPS.
  # It ships from main only, using the `staging` environment's secrets (the
  # current VPS IS the staging host). Landing service ONLY — it never touches
  # the server, so it can't disturb the staging app sharing the same box.
  deploy-landing:
    name: Deploy prod landing (current VPS)
    runs-on: ubuntu-latest
    needs: [docker-landing]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: staging
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Sync deploy/docker-compose.prod.yml to VPS
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: /opt/mycargolens/
          strip_components: 1
          overwrite: true

      - name: Deploy landing via SSH (SHA-tagged, health-gated, auto-rollback)
        if: ${{ vars.DEPLOY_METHOD == 'ssh' }}
        uses: appleboy/ssh-action@v1
        env:
          NEW_TAG: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: NEW_TAG
          script: |
            set -euo pipefail
            cd /opt/mycargolens
            if [ -f docker-compose.prod.yml ]; then
              mv -f docker-compose.prod.yml docker-compose.yml
            fi
            OLD_LANDING_TAG=$(grep '^LANDING_IMAGE_TAG=' .env | cut -d= -f2 || echo "latest")
            echo "▶ Deploying landing ${NEW_TAG:0:12} (previous: ${OLD_LANDING_TAG:0:12})"
            sed -i "s|^LANDING_IMAGE_TAG=.*|LANDING_IMAGE_TAG=${NEW_TAG}|" .env
            if ! docker compose pull landing; then
              echo "❌ Landing pull failed — reverting"
              sed -i "s|^LANDING_IMAGE_TAG=.*|LANDING_IMAGE_TAG=${OLD_LANDING_TAG}|" .env
              exit 1
            fi
            docker compose up -d landing
            OK=false
            for i in $(seq 1 15); do
              if curl -fsS http://localhost:3000 > /dev/null 2>&1; then OK=true; break; fi
              sleep 2
            done
            if [ "$OK" != "true" ]; then
              echo "❌ Landing health check failed — rolling back"
              sed -i "s|^LANDING_IMAGE_TAG=.*|LANDING_IMAGE_TAG=${OLD_LANDING_TAG}|" .env
              docker compose up -d landing
              docker compose logs --tail=30 landing || true
              exit 1
            fi
            echo "✅ Landing live (${NEW_TAG:0:12})"
            docker image prune -f
            docker compose ps landing
